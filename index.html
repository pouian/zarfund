
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>زر فاند</title>
    <link href="https://v1.fontapi.ir/css/Peida" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Peida', sans-serif;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
            direction: rtl;
        }
        .overlay {
            background-color: rgba(0,0,0,0.6);
            padding: 4rem 2rem;
            min-height: 100vh;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.2rem;
            max-width: 700px;
            margin: auto;
        }
        .buttons {
            margin-top: 2rem;
        }
        .buttons a {
            background: white;
            color: black;
            padding: 1rem 2rem;
            margin: 0.5rem;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
        .steps {
            margin-top: 4rem;
        }
        .step {
            margin: 1rem 0;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>زر فاند</h1>
        <p>ما بر این باوریم که ثروت واقعی نه از تصادف، که از شناخت، تصمیم‌گیری مستقل و پیوستگی در عمل به‌دست می‌آید. زر فاند برای کسانی ساخته شده که درک می‌کنند داشتن از فهمیدن آغاز می‌شود.</p>
        <div class="buttons">
            <a href="#">ورود اعضا</a>
            <a href="#">مشاهده بدون عضویت</a>
        </div>
        <div class="steps">
            <div class="step">۱. اول ببین، بعد بمان</div>
            <div class="step">۲. همراهی بدون آموزش</div>
            <div class="step">۳. زمان، مهربان با کسانی که می‌مانند</div>
        </div>
    </div>
</body>
</html>
